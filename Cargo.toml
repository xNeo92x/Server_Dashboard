[package]
name = "server-dashboard"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
description = "Native Rust/GTK4 server health dashboard for N-able N-sight RMM"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
glib = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"
roxmltree = "0.20"
regex = "1.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
