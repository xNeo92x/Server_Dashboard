<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Server Dashboard – Vorschau</title>
<desc id="desc">Dunkles Server-Monitoring-Dashboard für N-able N-sight RMM mit Serverstatus, Problemen und Systemauslastung.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090b0f"/>
    <stop offset="1" stop-color="#11141a"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b3fd6"/>
    <stop offset="1" stop-color="#7c5cff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
  </filter>
  <style>
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f3f4f6}
    .muted{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9ca3af}
    .tiny{font-size:13px}
    .small{font-size:15px}
    .body{font-size:17px}
    .h2{font-size:26px;font-weight:700}
    .h1{font-size:31px;font-weight:800}
    .card{fill:#14181e;stroke:#2b3038;stroke-width:1.5}
    .subcard{fill:#11151a;stroke:#252a31;stroke-width:1.2}
    .hair{stroke:#2b3038;stroke-width:1}
    .green{fill:#4ade80}
    .yellow{fill:#facc15}
    .red{fill:#fb7185}
    .purple{fill:#8b6cff}
    .gray{fill:#7b8491}
  </style>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="18" y="18" width="1564" height="864" rx="14" fill="#0f1217" stroke="#353b45" stroke-width="1.5"/>

